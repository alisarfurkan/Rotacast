- id: rye_cover
  name: {en: Winter rye (cover crop), tr: Çavdar (örtü bitkisi)}
  family: Poaceae
  category: cover
  season: winter
  sowing: {rule: tmean_below, threshold_c: 14, window_doy: [250, 310]}
  t_base_c: 0
  gdd_to_maturity: 1100             # to termination in spring, not grain maturity
  heat_stress_tmax_c: 35
  frost_damage_tmin_c: -25          # very hardy; effectively never counted
  sensitive_stage: ini
  fao56:
    stage_days: [50, 70, 60, 20]    # approx; cover crop terminated ~mid April
    kc: [0.4, 1.0, 0.3]             # approx, winter-cereal like
    root_depth_m: [0.3, 1.25]
    p: 0.55
    ky: 1.0                          # approx
  drought_tolerance: 4
  n_fixation_kg_ha: 0
  residue_index: 0.9
  rusle_c: 0.1
  root_type: fibrous
  forage_value: 1
  disease_groups: [cereal_root_rots, cereal_rusts]
  economics:
    yield_t_ha: {rainfed: 0, irrigated: 0}
    price_usd_t: 0
  irrigation_typical: none
  notes: {en: "Fast-growing winter cover that protects bare soil from wind and rain erosion and scavenges leftover nitrate. Do not follow it with wheat or barley.", tr: "Çıplak toprağı rüzgâr ve yağmur erozyonundan korur, artan nitratı tutar. Ardından buğday veya arpa ekilmemelidir."}
  sources: [fao56, ecocrop, rusle_ah703]

- id: sugar_beet

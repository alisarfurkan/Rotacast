    kc: [0.3, 1.15, 0.25]
    root_depth_m: [0.3, 1.25]
    p: 0.55
    ky: 1.0                          # approx
  drought_tolerance: 2
  n_fixation_kg_ha: 0
  residue_index: 0.6
  rusle_c: 0.2
  root_type: fibrous

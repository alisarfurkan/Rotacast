    root_depth_m: [0.3, 1.2]
    p: 0.55
    ky: 1.0                          # approx
  drought_tolerance: 3
  n_fixation_kg_ha: 30
  residue_index: 0.5
  rusle_c: 0.15
  root_type: fibrous
  forage_value: 3
  disease_groups: [legume_ascochyta, cereal_root_rots]
  economics:
    yield_t_ha: {rainfed: 3.0, irrigated: 6.0}   # hay, dry matter
    price_usd_t: 190                 # approx
  irrigation_typical: none
  notes: {en: "Autumn-sown mix where the barley supports the vetch; gives good hay and some nitrogen. Harvested in May, leaving time for a summer crop.", tr: "Arpanın fiğe destek olduğu sonbahar karışımıdır; kaliteli ot verir ve azot bırakır. Mayısta biçildiği için ardından yaz ürünü ekilebilir."}
  sources: [fao56, ecocrop, peoples2009, tuik]

- id: sainfoin
  name: {en: Sainfoin, tr: Korunga}

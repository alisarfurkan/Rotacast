  frost_damage_tmin_c: -5
  sensitive_stage: mid
  fao56:
    stage_days: [30, 45, 90, 15]    # FAO-56 T11 Mediterranean (Mar sowing)
    kc: [0.35, 1.2, 0.7]
    root_depth_m: [0.3, 0.95]
    p: 0.55
    ky: 1.0                          # FAO-33
  drought_tolerance: 2
  n_fixation_kg_ha: 0
  residue_index: 0.4
  rusle_c: 0.4
  root_type: tap
  forage_value: 1
  disease_groups: [beet_cyst_nematode, cercospora_leaf_spot]
  economics:
    yield_t_ha: {rainfed: 25, irrigated: 75}   # fresh roots
    price_usd_t: 60                  # TRY ~2,000/t in 2024; approx
  irrigation_typical: required
  notes: {en: "High-income but very thirsty crop that needs full irrigation in Konya. Repeat it no more than once every four years to avoid nematodes.", tr: "Geliri yüksek ama çok su isteyen bir üründür; Konya'da tam sulama gerekir. Nematodları önlemek için en az dört yılda bir ekilmelidir."}
  sources: [fao56, fao33, ecocrop, tuik]


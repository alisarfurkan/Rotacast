  fao56:
    stage_days: [30, 40, 50, 30]    # adapted from FAO-56 T11 maize grain 30/40/50/50 (170 d); approx
    kc: [0.3, 1.2, 0.6]
    root_depth_m: [0.3, 1.35]
    p: 0.55
    ky: 1.25                         # FAO-33
  drought_tolerance: 2
  n_fixation_kg_ha: 0

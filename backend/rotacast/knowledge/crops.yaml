# Rotacast crop knowledge base (schema: docs/CONTRACTS.md section 2).
#
# Conventions
# - FAO-56 (Allen et al. 1998): stage lengths Table 11, Kc Table 12, rooting depth & p Table 22.
#   Stage lengths: where FAO lists several regions, the Mediterranean / continental entry is used and then
#   adapted to the Konya calendar (marked "adapted"). The engine rescales stages to gdd_to_maturity anyway.
#   Kc: ranges in Table 12 are given as the midpoint. root_depth_m = [0.3 initial, midpoint of Table 22 range].
#   Winter cereals/canola: Kc_ini 0.7 (Table 12 value for frozen/wet-winter soils, Konya has cold winters).
# - Ky: FAO-33 (Doorenbos & Kassam 1979) seasonal total where listed, else FAO-66 (Steduto et al. 2012)
#   or a conservative literature value marked "# approx".
# - economics.yield_t_ha.irrigated = water-UNLIMITED POTENTIAL yield Ym (good Konya management); the engine
#   multiplies it by its own water-stress yield ratio. rainfed = typical observed Konya rainfed yield, kept only
#   as a calibration reference. Basis: TUIK crop production statistics 2022-2024 (Konya province), rounded.
#   Yields are dry grain/seed/hay unless stated; silage maize and potato/sugar beet are fresh weight.
# - price_usd_t: Turkiye farm-gate / TMO purchase level 2024-2025, converted at ~32-36 TRY/USD. Rough tiers.
# - Cover crops have no sold yield: yield 0, price 0 (benefit is in soil indicators, not income).
# - Sowing windows are Northern-Hemisphere DOY (Mar 1=60, Apr 1=91, May 1=121, Jun 1=152, Jul 1=182,
#   Aug 1=213, Sep 1=244, Oct 1=274, Nov 1=305).
# - n_fixation_kg_ha: typical net N credit left for the next crop (conservative; approx for all).
# - rusle_c: seasonal average cover-management factor; approx, order of magnitude from USDA AH-703 tables.

- id: wheat_winter
  name: {en: Winter wheat, tr: Kışlık buğday}
  family: Poaceae
  category: cereal
  season: winter
  sowing: {rule: tmean_below, threshold_c: 12, window_doy: [270, 330]}
  t_base_c: 0
  gdd_to_maturity: 2100
  heat_stress_tmax_c: 32        # anthesis heat
  frost_damage_tmin_c: -2       # frost at flowering
  sensitive_stage: mid
  fao56:
    stage_days: [120, 70, 45, 30]   # adapted: FAO-56 T11 winter wheat (long cold-winter entry 160/75/75/25) shortened for Oct-Jul Konya; approx
    kc: [0.7, 1.15, 0.25]
    root_depth_m: [0.3, 1.65]
    p: 0.55
    ky: 1.0                          # FAO-33 winter wheat
  drought_tolerance: 3
  n_fixation_kg_ha: 0
  residue_index: 0.7
  rusle_c: 0.2
  root_type: fibrous
  forage_value: 1
  disease_groups: [cereal_root_rots, cereal_rusts, fusarium_head_blight]
  economics:
    yield_t_ha: {rainfed: 2.6, irrigated: 6.5}
    price_usd_t: 280                 # TMO 2024 bread wheat ~9,250 TRY/t
  irrigation_typical: optional
  notes: {en: "The backbone cereal of the Konya Plain; sown in autumn and harvested in early summer. Growing it year after year builds up root diseases, so it needs a break crop.", tr: "Konya Ovası'nın temel tahılıdır; sonbaharda ekilir, yaz başında hasat edilir. Her yıl üst üste ekilirse kök hastalıkları artar, bu yüzden araya başka ürün girmelidir."}
  sources: [fao56, fao33, ecocrop, tuik, tmo]

- id: barley_winter
  name: {en: Winter barley, tr: Kışlık arpa}
  family: Poaceae
  category: cereal
  season: winter
  sowing: {rule: tmean_below, threshold_c: 13, window_doy: [265, 325]}
  t_base_c: 0
  gdd_to_maturity: 1900
  heat_stress_tmax_c: 30
  frost_damage_tmin_c: -3
  sensitive_stage: mid
  fao56:
    stage_days: [115, 65, 45, 28]    # adapted from FAO-56 T11 barley/oats entries; approx
    kc: [0.7, 1.15, 0.25]
    root_depth_m: [0.3, 1.25]
    p: 0.55
    ky: 1.0                          # approx (not listed separately in FAO-33)
  drought_tolerance: 4
  n_fixation_kg_ha: 0
  residue_index: 0.6
  rusle_c: 0.2
  root_type: fibrous
  forage_value: 2
  disease_groups: [cereal_root_rots, cereal_rusts, fusarium_head_blight]
  economics:
    yield_t_ha: {rainfed: 2.4, irrigated: 6.0}
    price_usd_t: 240                 # TMO 2024 barley ~8,000 TRY/t; approx
  irrigation_typical: optional
  notes: {en: "Matures earlier and tolerates drought better than wheat, so it fits after a legume or in water-saving rotations. Early harvest leaves time to sow a cover crop.", tr: "Buğdaydan erken olgunlaşır ve kuraklığa daha dayanıklıdır; baklagilden sonra veya su tasarruflu rotasyonlarda uygundur. Erken hasat sayesinde ardından örtü bitkisi ekilebilir."}
  sources: [fao56, ecocrop, tuik, tmo]


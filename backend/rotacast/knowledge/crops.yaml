    price_usd_t: 180                 # approx
  irrigation_typical: optional
  notes: {en: "Perennial forage legume (stand lasts about 3 years) that thrives without irrigation on calcareous soils. Deep roots and permanent cover improve soil structure and cut erosion.", tr: "Yaklaşık 3 yıl ömürlü çok yıllık yem baklagilidir; kireçli topraklarda sulamasız da iyi gelişir. Derin kökleri ve sürekli örtüsü toprak yapısını iyileştirir, erozyonu azaltır."}
